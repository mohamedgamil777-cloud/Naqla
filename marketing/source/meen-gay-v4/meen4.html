<script>

const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const eo = (x) => 1 - Math.pow(1 - clamp(x), 3);

  if (t > S3 + 2.3) { const wa = prog(t, S3 + 2.3, 0.2), up = eo(prog(t, S3 + 2.42, 0.3));
    d.arms = mix(d.arms || REST, { ns: -6, ne: 20, fs: -4, fe: 11 }, Math.sin(wa * Math.PI) * (1 - up));        // anticipation: arm dips back
    if (up > 0) d.arms = mix(d.arms, { ns: 150 + Math.sin((t - S3 - 2.6) * 9) * 9, ne: -35, nw: -8, fs: -4, fe: 11 }, up);
    d.handN = 'open'; d.mouth = 'grin'; d.look = [0.6, 0]; d.turn = -0.3; }
  d.face = 'right'; d.base = `translate(${w.x} 1830) scale(${S})`;
  $('drvStWrap').style.display = t > S3 + 1.5 ? '' : 'none';
  $('drvStWrap').setAttribute('opacity', clamp((t - S3 - 1.5) / 0.15)); drvS.set(d);
  const nk = eo(prog(t, S3 + 0.6, 0.5));
  $('notif').setAttribute('opacity', clamp(nk * 2)); $('notif').setAttribute('transform', `translate(0 ${(1 - nk) * -240})`);
}

function endScene(t) {
  const k = eo(prog(t, SE + 0.2, 0.8));
  $('endLogo').setAttribute('opacity', k); $('endLogo').setAttribute('transform', `translate(540 707) scale(${0.94 + 0.06 * k}) translate(-540 -707)`);
  draw($('endLine'), eo(prog(t, 31.6, 0.8)));
  const dk = eo(prog(t, 32.3, 0.3)); $('endDot').setAttribute('opacity', dk); $('endDot').setAttribute('r', 18 * dk);
}

function thoughts(t) {
  const on = t < S2;
  for (const th of document.querySelectorAll('.th')) {
    const a = +th.dataset.a, b = +th.dataset.b, k = eo(prog(t, a, 0.45)), out = clamp((b - t) / 0.3);
    const vis = on && t >= a && t < b; th.setAttribute('opacity', vis ? Math.min(clamp(k * 2), out) : 0);
    th.setAttribute('transform', `translate(0 ${(1 - k) * 40})`);
  }
  for (const s of document.querySelectorAll('.say')) { const k = eo(prog(t, +s.dataset.t, 0.4)); s.setAttribute('opacity', clamp(k * 2)); s.setAttribute('transform', `translate(${(1 - k) * 80} 0)`); }
  $('ringPhone').setAttribute('transform', `translate(780 625) rotate(${t > 5.2 && t < 6.8 ? Math.sin(t * 46) * 6 : 0})`);
  const dOn = on && t > 5.2 && t < 11.0;
  $('tDots').setAttribute('opacity', dOn ? clamp((t - 5.2) / 0.3) * clamp((11.0 - t) / 0.3) : 0);
  [...$('tDots').children].forEach((c, i) => { c.setAttribute('cx', 470 + i * 34); c.setAttribute('cy', 880 - i * 40); });
  const mk2 = eo(prog(t, S4 + 1.9, 0.5)), mon = t >= S4 + 1.9 && t < SE;
  $('match').setAttribute('opacity', mon ? clamp(mk2 * 2) : 0); $('match').setAttribute('transform', `translate(0 ${(1 - mk2) * 50})`);
  avM.set({ ...alive(t, 5), mouth: 'grin', brow: 'happy', look: [0.2, 0.1], face: 'right' });
}


const texts = [...document.querySelectorAll('.tx')];
const CUTS = [S2, S3, S4, SE];
window.render = (t) => {
  const scene = t < S2 ? 'home' : t < S3 ? 'app' : t < S4 ? 'street' : t < SE ? 'home' : 'end';
  for (const id of ['home', 'app', 'street', 'end']) $(id).style.display = id === scene ? '' : 'none';
  if (scene === 'home') homeScene(t);
  if (scene === 'app') appScene(t);
  if (scene === 'street') streetScene(t);
  if (scene === 'end') endScene(t);
  thoughts(t);
  for (const x of texts) { const on = t >= +x.dataset.s && t < +x.dataset.e; const k = eo(prog(t, +x.dataset.t, 0.55)), out = clamp((+x.dataset.e - t) / 0.2);
    x.setAttribute('opacity', on ? Math.min(clamp(k * 1.8), out) : 0); x.setAttribute('transform', `translate(${(1 - k) * 140} 0)`); }
  // orange sweep across each cut (right → left)
  let sw = null; for (const c of CUTS) if (t > c - 0.28 && t < c + 0.28) sw = (t - (c - 0.28)) / 0.56;
  const s = $('sweep');
  if (sw === null) s.setAttribute('opacity', 0); else { const x = lerp(1180, -1400, eio(sw)); s.setAttribute('opacity', 1); s.setAttribute('x', x); s.setAttribute('width', 1300); }
};
window.ready = document.fonts.ready.then(() => window.render(0));
</script>
</body>
